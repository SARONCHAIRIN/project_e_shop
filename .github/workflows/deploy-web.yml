name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env
        run: |
          cat > .env <<EOF
          APP_NAME=My E Shop
          APP_ENV=production
          API_BASE_URL=https://e-shop-1-m034.onrender.com/api/v1
          TIMEOUT=30
          MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}
          EOF

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Vercel
        run: npx vercel deploy build/web --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"